# early-tracking config
# Copy this file to config.yaml and fill in your values

twitter:
  # One cookie per line in flow style { } — keeps indentation foolproof.
  # Keep or remove lines to match how many accounts you have (1 is enough).
  cookies:
    - { auth_token: "AUTH_TOKEN_1", ct0: "CT0_1" }
    - { auth_token: "AUTH_TOKEN_2", ct0: "CT0_2" }
    - { auth_token: "AUTH_TOKEN_3", ct0: "CT0_3" }
    - { auth_token: "AUTH_TOKEN_4", ct0: "CT0_4" }

# File containing accounts to watch (one per line)
# Supports: https://x.com/Handle, @Handle, Handle
watch_file: twitter.txt

tracking:
  # Alert on ALL new follows (true) or only target accounts (false)
  track_all_follows: true
  # How often to scan (Go duration: 10m, 1h, 30s)
  poll_interval: 10m
  # Users per page when fetching following list
  page_size: 10
  # Max pages to fetch per watcher per scan
  max_pages: 2
  # Delay between pages
  page_delay: 500ms

discord:
  # Discord webhook URL(s) for raw follow alerts (per-follow, real-time)
  raw_webhooks:
    - "https://discord.com/api/webhooks/YOUR_WEBHOOK_HERE"
  # Webhook for the categorized summary. Leave empty to disable summaries.
  summary_webhook: "https://discord.com/api/webhooks/YOUR_SUMMARY_WEBHOOK_HERE"
  # How often to post the summary (Go duration: 1h, 30m, 2h)
  summary_interval: 1h
  # Once a project appears in a summary it is excluded from future summaries for
  # this long, so each project is reported only once (keeps the channel clean).
  summary_dedup_ttl: 720h  # 30 days

categorization:
  # Set false to disable categorization (raw alerts still work).
  enabled: true
  # Use recent tweets as an extra signal (one extra API call per uncached
  # target). Set false to categorize from username + name + bio only.
  use_tweets: true
  # How many recent tweets to fetch when use_tweets is on.
  tweet_count: 5
  # Base taxonomy. The LLM prefers these but may add a new one when nothing fits.
  categories:
    - AI
    - Layer 1
    - Layer 2
    - DeFi
    - NFT
    - Gaming
    - Meme
    - DePIN
    - RWA
    - Infra
    - Social
  # How long a categorized handle stays cached before being re-checked.
  cache_ttl: 168h  # 7 days
  # File holding OpenRouter API keys (one per line). Recommended place for keys
  # so they stay out of config.yaml. Merged with any api_keys below.
  keys_file: llm.txt
  openrouter:
    # Keys can also be listed here, but llm.txt is preferred. Multiple keys are
    # rotated round-robin. If no keys at all, categorization uses keywords only.
    api_keys: []
    # Free-tier models, tried in order until one succeeds.
    models:
      - "meta-llama/llama-3.3-70b-instruct:free"
      - "google/gemini-2.0-flash-exp:free"
      - "deepseek/deepseek-chat-v3-0324:free"

logging:
  timezone: Asia/Jakarta
  level: info  # debug, info, warn, error
