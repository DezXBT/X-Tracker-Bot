# early-tracking config
# Copy this file to config.yaml and fill in your values

twitter:
  # One cookie per line in flow style { } — keeps indentation foolproof.
  # Keep or remove lines to match how many accounts you have (1 is enough).
  cookies:
    - { auth_token: "AUTH_TOKEN_1", ct0: "CT0_1" }
    - { auth_token: "AUTH_TOKEN_2", ct0: "CT0_2" }
    - { auth_token: "AUTH_TOKEN_3", ct0: "CT0_3" }
    - { auth_token: "AUTH_TOKEN_4", ct0: "CT0_4" }

# File containing accounts to watch (one per line)
# Supports: https://x.com/Handle, @Handle, Handle
watch_file: twitter.txt

tracking:
  # Alert on ALL new follows (true) or only target accounts (false)
  track_all_follows: true
  # How often to scan (Go duration: 10m, 1h, 30s)
  poll_interval: 10m
  # Users per page when fetching following list
  page_size: 10
  # Max pages to fetch per watcher per scan
  max_pages: 2
  # Delay between pages
  page_delay: 500ms
  # Refresh GraphQL query IDs + feature flags from x.com at startup. Leave false
  # (default) — the built-in IDs are proven to work. Only enable if X rotates
  # them out and scans start failing with GraphQL errors.
  dynamic_query_ids: false

discord:
  # Discord webhook URL(s) for raw follow alerts (per-follow, real-time)
  raw_webhooks:
    - "https://discord.com/api/webhooks/YOUR_WEBHOOK_HERE"
  # Webhook for the categorized summary. Leave empty to disable summaries.
  summary_webhook: "https://discord.com/api/webhooks/YOUR_SUMMARY_WEBHOOK_HERE"
  # How often to post the summary (Go duration: 1h, 30m, 2h)
  summary_interval: 1h
  # Once a project appears in a summary it is excluded from future summaries for
  # this long, so each project is reported only once (keeps the channel clean).
  summary_dedup_ttl: 720h  # 30 days
  # Summary follower filter: only show targets with followers <= max in the
  # summary (keeps the digest focused on smaller/early accounts). Targets above
  # the max are not sent to the summary webhook. Does NOT affect per-follow raw
  # alerts. On by default — set enabled to false to show every target.
  summary_max_followers_enabled: true   # set false to disable the filter
  summary_max_followers: 1000           # max followers to display (when enabled)
  # Show each account's latest bio as an indented line under it in the summary.
  summary_show_bio: true                 # 📝 set false to hide bios

  # ── Fast-scan signal markers (all default ON; set false to hide) ───────────
  # 🔥 Consensus heat: more distinct watchlist accounts following the same
  # target in one window = hotter. 2 → 🔥, 3-4 → 🔥🔥, 5+ → 🔥🔥🔥. Shown next
  # to the handle so the strongest signals jump out first.
  summary_show_heat: true
  # ⚡ Burst detection: flags a target when burst_min distinct watchers followed
  # it inside burst_window — a tight cluster usually means it's being shared in
  # alpha groups right now. Shows the span, e.g. "⚡8m".
  summary_burst_min: 3        # distinct watchers (min 2)
  summary_burst_window: 30m   # within this span
  # ✨/🕯️ Account age: fresh accounts (✨) that already attract watchlist follows
  # are early-opportunity signals; older accounts get 🕯️. Set fresh_max_days to
  # a negative number to disable the ✨ marker entirely.
  summary_show_age: true
  summary_fresh_max_days: 30  # accounts <= this many days old are "fresh"
  # 📈 Contract auto-detect: scans each bio for an EVM (0x…) or Solana address
  # and, when found, adds a DexScreener chart link to the action links.
  summary_show_contract: true
  # Action links shown under each target: a copy-paste `.first @handle` command
  # and (when a contract is detected) a 📈 chart link.
  summary_show_links: true
  # ⭐ Recurring marker: flags a target that appeared in a previous summary
  # window. With the default 30-day dedup TTL recurring targets are usually
  # suppressed; lower summary_dedup_ttl to actually see the ⭐ marker.
  summary_show_mutual: true
  # Mute categories entirely (case-insensitive). Muted categories never appear
  # in the summary, digest, or instant alerts. Empty = mute nothing.
  summary_mute_categories: []   # e.g. ["Meme", "NFT"]

  # ── Threshold instant-alert (separate, high-urgency ping) ──────────────────
  # When a target crosses threshold_alert_watchers distinct watchers inside
  # threshold_alert_window, fire an immediate 🚨 alert instead of waiting for the
  # next summary tick. Off by default. Deduped: a target alerts at most once per
  # window. Falls back to summary_webhook when threshold_alert_webhook is blank.
  threshold_alert_enabled: false
  threshold_alert_watchers: 3       # distinct watchers to trigger (min 2)
  threshold_alert_window: 30m       # within this span
  threshold_alert_webhook: ""       # blank → use summary_webhook
  threshold_alert_mention: ""       # e.g. "<@123456789>" or "@here" to ping

  # ── Daily digest (once-a-day top-N recap) ──────────────────────────────────
  # A standalone leaderboard of the most-followed targets across the digest
  # window — read it once a day instead of watching every hourly summary. Off by
  # default. Does not dedup against the hourly summary. Falls back to
  # summary_webhook when digest_webhook is blank.
  digest_enabled: false
  digest_interval: 24h
  digest_top_n: 10
  digest_webhook: ""                # blank → use summary_webhook

categorization:
  # Set false to disable categorization (raw alerts still work).
  enabled: true
  # Use recent tweets as an extra signal (one extra API call per uncached
  # target). Set false to categorize from username + name + bio only.
  use_tweets: true
  # How many recent ORIGINAL tweets to fetch when use_tweets is on (retweets are
  # skipped). More tweets = better person-vs-project signal, at a bit more cost.
  tweet_count: 8
  # Base taxonomy. The LLM prefers these but may add a new one when nothing fits.
  # KOL = an individual person (influencer/alpha caller/commentator), not a project.
  categories:
    - AI
    - Layer 1
    - Layer 2
    - DeFi
    - NFT
    - Gaming
    - Meme
    - DePIN
    - RWA
    - Infra
    - Social
    - KOL
    - Trading
    - Other
  # How long a categorized handle stays cached before being re-checked.
  cache_ttl: 168h  # 7 days
  # File holding OpenRouter API keys (one per line). Recommended place for keys
  # so they stay out of config.yaml. Merged with any api_keys below.
  keys_file: llm.txt
  openrouter:
    # Keys can also be listed here, but llm.txt is preferred. Multiple keys are
    # rotated round-robin. If no keys at all, categorization uses keywords only.
    api_keys: []
    # Free-tier models, tried in order until one succeeds. NOTE: OpenRouter's
    # free model names change often — if you get HTTP 404s, update this list from
    # https://openrouter.ai/models?max_price=0
    models:
      - "openai/gpt-oss-120b:free"
      - "z-ai/glm-4.5-air:free"
      - "openai/gpt-oss-20b:free"
      - "poolside/laguna-m.1:free"
      - "poolside/laguna-xs.2:free"

# (Optional) Frontrun enrichment for the summary. When enabled, each account in
# the summary gets extra signals: a username-change marker (✏️ ex @oldname) and a
# smart-followers count (🧠 N). Off by default — leave enabled false to skip it
# entirely (no API calls, no extra latency). Only affects the summary, not raw alerts.
frontrun:
  enabled: false
  # Base URL of the Frontrun API (the host the web app talks to). Leave blank to
  # use the built-in default.
  base_url: "https://loadbalance.frontrun.pro"
  # Session token pool. Multiple tokens are rotated round-robin across requests,
  # and a throttled/expired token automatically retries on the next one.
  tokens:
    - "SESSION_TOKEN_1"
    - "SESSION_TOKEN_2"
  # Optional single token (merged into the pool above).
  token: ""
  # Optional file with one token per line (merged into the pool). Keep tokens out
  # of config.yaml by putting them here. Git-ignored.
  token_file: frontrun.txt
  # Client headers the Frontrun web app sends (update if Frontrun changes them).
  # Leave blank to use the built-in defaults. An empty client_version makes the
  # API reject every request, so don't set it to "".
  client_version: "0.0.216"
  client_language: "EN_US"
  # Toggle each enrichment independently.
  show_username_change: true   # ✏️ ex @oldname
  show_smart_followers: true   # 🧠 N
  # How long a fetched enrichment is cached per handle (saves API calls).
  cache_ttl: 168h  # 7 days

logging:
  timezone: Asia/Jakarta
  level: info  # debug, info, warn, error
